<!DOCTYPE html>
<html lang="uz" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shaxsiy Yordamchi</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: {
              50: '#eff6ff',
              500: '#3b82f6',
              600: '#2563eb',
              700: '#1d4ed8',
              900: '#1e3a8a',
            }
          }
        }
      }
    }
  </script>
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200">

  <!-- Header -->
  <header class="sticky top-0 z-50 bg-slate-800/80 backdrop-blur-md border-b border-slate-700 px-4 py-3 flex items-center justify-between">
    <div class="flex items-center space-x-2">
      <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-lg shadow-lg shadow-blue-500/30">⚡</div>
      <h1 class="text-lg font-bold bg-gradient-to-r from-blue-400 to-indigo-400 bg-clip-text text-transparent">Yordamchi</h1>
    </div>
    <span id="quickCount" class="text-xs bg-slate-700 text-slate-300 px-2.5 py-1 rounded-full border border-slate-600">0 Saqlangan</span>
  </header>

  <!-- Main Content Area -->
  <main class="flex-1 pb-24 p-4 max-w-lg mx-auto w-full">

    <!-- 💡 G'OYALAR BO'LIMI -->
    <section id="sec-ideas" class="tab-content space-y-4">
      <div class="flex items-center justify-between">
        <h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-lightbulb text-amber-400"></i> Video G'oyalari</h2>
      </div>

      <form id="ideaForm" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3 shadow-md">
        <input type="text" id="ideaTitle" placeholder="G'oya yoki mavzu..." required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500">
        <div class="flex gap-2">
          <select id="ideaCategory" class="bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-xs focus:outline-none focus:border-blue-500">
            <option value="⚽ Futbol">⚽ Futbol</option>
            <option value="🎬 Kino">🎬 Kino</option>
            <option value="🌍 Faktlar">🌍 Faktlar</option>
            <option value="📌 Umumiy">📌 Umumiy</option>
          </select>
          <button type="submit" class="flex-1 bg-blue-600 hover:bg-blue-700 font-medium py-2 rounded-xl text-sm transition-all shadow-md active:scale-95">Saqlash</button>
        </div>
      </form>

      <div id="ideasList" class="space-y-2.5"></div>
    </section>

    <!-- 🔗 LINKLAR BO'LIMI -->
    <section id="sec-links" class="tab-content hidden space-y-4">
      <h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-link text-blue-400"></i> Saqlangan Linklar</h2>

      <form id="linkForm" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3 shadow-md">
        <input type="url" id="linkUrl" placeholder="https://youtube.com/..." required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500">
        <input type="text" id="linkNote" placeholder="Qisqacha izoh (masalan: Montaj effekti)" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500">
        <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 font-medium py-2 rounded-xl text-sm transition-all shadow-md active:scale-95">Linkni Qo'shish</button>
      </form>

      <div id="linksList" class="space-y-2.5"></div>
    </section>

    <!-- 📚 MA'LUMOTLAR BAZASI -->
    <section id="sec-db" class="tab-content hidden space-y-4">
      <h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-database text-emerald-400"></i> Ma'lumotlar Bazasi</h2>

      <form id="dbForm" class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3 shadow-md">
        <input type="text" id="dbTitle" placeholder="Mavzu nomi..." required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:border-blue-500">
        <textarea id="dbContent" rows="3" placeholder="Bo'lajak video uchun to'plangan ma'lumotlar..." required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2 text-sm focus:outline-none focus:border-blue-500"></textarea>
        <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 font-medium py-2 rounded-xl text-sm transition-all shadow-md active:scale-95">Bazaga Kiritish</button>
      </form>

      <div id="dbList" class="space-y-3"></div>
    </section>

    <!-- 🎮 O'YIN KULGU -->
    <section id="sec-fun" class="tab-content hidden space-y-4">
      <h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-gamepad text-purple-400"></i> O'yin & Dam Olish</h2>

      <!-- Fun Cards -->
      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
        <h3 class="font-semibold text-sm text-slate-300">🎲 Kun Ibora / Motivatsiya</h3>
        <p id="quoteText" class="text-sm italic text-slate-400">"Tanaffus ham ishning bir qismi."</p>
        <button onclick="newQuote()" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-1.5 rounded-lg border border-slate-600">Boshqasi 🔄</button>
      </div>

      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-3">
        <div class="flex justify-between items-center">
          <h3 class="font-semibold text-sm text-slate-300">❌ Tic-Tac-Toe ⭕</h3>
          <button onclick="resetTicTacToe()" class="text-xs text-blue-400">Qayta boshlash</button>
        </div>
        <div id="tttBoard" class="grid grid-cols-3 gap-2 w-48 mx-auto"></div>
        <p id="tttStatus" class="text-center text-xs text-slate-400 font-medium">Navbat: X</p>
      </div>
    </section>

    <!-- ⚙️ SOZLAMALAR -->
    <section id="sec-settings" class="tab-content hidden space-y-4">
      <h2 class="text-xl font-bold flex items-center gap-2"><i class="fa-solid fa-gear text-slate-400"></i> Sozlamalar</h2>

      <div class="bg-slate-800 p-4 rounded-2xl border border-slate-700 space-y-4">
        <div class="flex items-center justify-between">
          <div>
            <p class="font-medium text-sm">Tungi rejim (Dark Mode)</p>
            <p class="text-xs text-slate-400">Ekran rangini o'zgartirish</p>
          </div>
          <button id="themeToggle" onclick="toggleTheme()" class="w-12 h-6 bg-blue-600 rounded-full p-1 transition-colors relative">
            <div id="themeDot" class="w-4 h-4 bg-white rounded-full transition-transform transform translate-x-6"></div>
          </button>
        </div>

        <hr class="border-slate-700">

        <div class="space-y-2">
          <p class="font-medium text-sm">Ma'lumotlar Zaxirasi</p>
          <div class="flex gap-2">
            <button onclick="exportData()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-xs border border-slate-600">Export (Yuklab olish)</button>
            <button onclick="document.getElementById('importFile').click()" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded-xl text-xs border border-slate-600">Import (Tiklash)</button>
            <input type="file" id="importFile" class="hidden" onchange="importData(event)">
          </div>
        </div>
      </div>
    </section>

  </main>

  <!-- Bottom Navigation Bar -->
  <nav class="fixed bottom-0 left-0 right-0 bg-slate-800/90 backdrop-blur-lg border-t border-slate-700 z-50">
    <div class="max-w-lg mx-auto flex justify-around py-2 px-1">
      <button onclick="switchTab('ideas')" class="nav-btn flex flex-col items-center py-1 px-3 rounded-xl text-blue-400 font-medium text-xs transition-all" data-tab="ideas">
        <i class="fa-solid fa-lightbulb text-lg mb-1"></i> G'oyalar
      </button>
      <button onclick="switchTab('links')" class="nav-btn flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 font-medium text-xs transition-all" data-tab="links">
        <i class="fa-solid fa-link text-lg mb-1"></i> Linklar
      </button>
      <button onclick="switchTab('db')" class="nav-btn flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 font-medium text-xs transition-all" data-tab="db">
        <i class="fa-solid fa-database text-lg mb-1"></i> Baza
      </button>
      <button onclick="switchTab('fun')" class="nav-btn flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 font-medium text-xs transition-all" data-tab="fun">
        <i class="fa-solid fa-gamepad text-lg mb-1"></i> O'yin
      </button>
      <button onclick="switchTab('settings')" class="nav-btn flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 font-medium text-xs transition-all" data-tab="settings">
        <i class="fa-solid fa-gear text-lg mb-1"></i> Sozlama
      </button>
    </div>
  </nav>

  <!-- Logic Script -->
  <script>
    // State Store
    let state = JSON.parse(localStorage.getItem('assistant_data')) || {
      ideas: [],
      links: [],
      db: [],
      darkMode: true
    };

    function saveState() {
      localStorage.setItem('assistant_data', JSON.stringify(state));
      updateCounts();
    }

    function updateCounts() {
      const total = state.ideas.length + state.links.length + state.db.length;
      document.getElementById('quickCount').innerText = `${total} Saqlangan`;
    }

    // Tab Navigation
    function switchTab(tabName) {
      document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
      document.getElementById(`sec-${tabName}`).classList.remove('hidden');

      document.querySelectorAll('.nav-btn').forEach(btn => {
        if(btn.dataset.tab === tabName) {
          btn.className = "nav-btn flex flex-col items-center py-1 px-3 rounded-xl text-blue-400 font-medium text-xs transition-all";
        } else {
          btn.className = "nav-btn flex flex-col items-center py-1 px-3 rounded-xl text-slate-400 font-medium text-xs transition-all";
        }
      });
    }

    // --- G'OYALAR LOGIKASI ---
    document.getElementById('ideaForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('ideaTitle').value.trim();
      const category = document.getElementById('ideaCategory').value;
      if(!title) return;

      state.ideas.unshift({ id: Date.now(), title, category, date: new Date().toLocaleDateString() });
      saveState();
      renderIdeas();
      document.getElementById('ideaTitle').value = '';
    });

    function renderIdeas() {
      const container = document.getElementById('ideasList');
      if(!state.ideas.length) {
        container.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">Hozircha g'oyalar yo'q</p>`;
        return;
      }
      container.innerHTML = state.ideas.map(item => `
        <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 flex items-center justify-between">
          <div>
            <span class="text-[10px] px-2 py-0.5 rounded-full bg-slate-700 text-slate-300">${item.category}</span>
            <p class="text-sm font-medium text-slate-200 mt-1">${item.title}</p>
          </div>
          <button onclick="deleteItem('ideas', ${item.id})" class="text-slate-500 hover:text-red-400 p-1.5"><i class="fa-solid fa-trash-can text-sm"></i></button>
        </div>
      `).join('');
    }

    // --- LINKLAR LOGIKASI ---
    document.getElementById('linkForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const url = document.getElementById('linkUrl').value.trim();
      const note = document.getElementById('linkNote').value.trim();
      if(!url) return;

      state.links.unshift({ id: Date.now(), url, note: note || 'Izohsiz', date: new Date().toLocaleDateString() });
      saveState();
      renderLinks();
      document.getElementById('linkUrl').value = '';
      document.getElementById('linkNote').value = '';
    });

    function renderLinks() {
      const container = document.getElementById('linksList');
      if(!state.links.length) {
        container.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">Hozircha saqlangan linklar yo'q</p>`;
        return;
      }
      container.innerHTML = state.links.map(item => `
        <div class="bg-slate-800/60 p-3 rounded-xl border border-slate-700/60 flex items-center justify-between">
          <div class="overflow-hidden mr-2">
            <p class="text-xs font-semibold text-blue-400 truncate">${item.note}</p>
            <a href="${item.url}" target="_blank" class="text-xs text-slate-400 underline truncate block mt-0.5">${item.url}</a>
          </div>
          <button onclick="deleteItem('links', ${item.id})" class="text-slate-500 hover:text-red-400 p-1.5"><i class="fa-solid fa-trash-can text-sm"></i></button>
        </div>
      `).join('');
    }

    // --- BAZA LOGIKASI ---
    document.getElementById('dbForm').addEventListener('submit', (e) => {
      e.preventDefault();
      const title = document.getElementById('dbTitle').value.trim();
      const content = document.getElementById('dbContent').value.trim();
      if(!title || !content) return;

      state.db.unshift({ id: Date.now(), title, content });
      saveState();
      renderDB();
      document.getElementById('dbTitle').value = '';
      document.getElementById('dbContent').value = '';
    });

    function renderDB() {
      const container = document.getElementById('dbList');
      if(!state.db.length) {
        container.innerHTML = `<p class="text-center text-xs text-slate-500 py-6">Baza bo'sh</p>`;
        return;
      }
      container.innerHTML = state.db.map(item => `
        <div class="bg-slate-800/60 p-3.5 rounded-xl border border-slate-700/60 space-y-2">
          <div class="flex justify-between items-start">
            <h4 class="text-sm font-semibold text-emerald-400">${item.title}</h4>
            <div class="flex gap-1">
              <button onclick="copyText(\`${escapeQuotes(item.content)}\`)" class="text-xs bg-slate-700 hover:bg-slate-600 text-slate-300 px-2 py-1 rounded"><i class="fa-regular fa-copy"></i></button>
              <button onclick="deleteItem('db', ${item.id})" class="text-xs text-slate-500 hover:text-red-400 px-2 py-1"><i class="fa-solid fa-trash-can"></i></button>
            </div>
          </div>
          <p class="text-xs text-slate-300 whitespace-pre-wrap leading-relaxed">${item.content}</p>
        </div>
      `).join('');
    }

    function escapeQuotes(str) {
      return str.replace(/'/g, "\\'").replace(/"/g, '\\"');
    }

    function copyText(text) {
      navigator.clipboard.writeText(text);
      alert("Nusxalandi!");
    }

    function deleteItem(type, id) {
      state[type] = state[type].filter(x => x.id !== id);
      saveState();
      if(type === 'ideas') renderIdeas();
      if(type === 'links') renderLinks();
      if(type === 'db') renderDB();
    }

    // --- SOZLAMALAR & THEME ---
    function toggleTheme() {
      state.darkMode = !state.darkMode;
      applyTheme();
      saveState();
    }

    function applyTheme() {
      const body = document.body;
      const dot = document.getElementById('themeDot');
      if(state.darkMode) {
        body.className = "bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans transition-colors duration-200";
        dot.style.transform = 'translateX(24px)';
      } else {
        body.className = "bg-slate-100 text-slate-800 min-h-screen flex flex-col font-sans transition-colors duration-200";
        dot.style.transform = 'translateX(0px)';
      }
    }

    function exportData() {
      const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(state));
      const dlAnchorElem = document.createElement('a');
      dlAnchorElem.setAttribute("href", dataStr);
      dlAnchorElem.setAttribute("download", `yordamchi_baza_${new Date().toISOString().slice(0,10)}.json`);
      dlAnchorElem.click();
    }

    function importData(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          state = JSON.parse(e.target.result);
          saveState();
          renderIdeas();
          renderLinks();
          renderDB();
          applyTheme();
          alert("Ma'lumotlar tiklandi!");
        } catch(err) {
          alert("Fayl formati noto'g'ri!");
        }
      };
      reader.readAsText(file);
    }

    // --- O'YIN (TIC TAC TOE) ---
    const quotes = [
      "\"Muvaffaqiyat — har kuni takrorlanadigan kichik harakatlar yig'indisidir.\"",
      "\"Ajoyib kontent — bu tomoshabinga berilgan qimmatli sovg'a.\"",
      "\"Tanaffus ham ish unumdorligining bir qismi.\"",
      "\"Bugun ekkan urug'ingiz, ertaga hosil beradi.\""
    ];

    function newQuote() {
      const idx = Math.floor(Math.random() * quotes.length);
      document.getElementById('quoteText').innerText = quotes[idx];
    }

    let tttState = Array(9).fill(null);
    let tttPlayer = 'X';

    function initTTT() {
      const board = document.getElementById('tttBoard');
      board.innerHTML = '';
      tttState.forEach((val, idx) => {
        const btn = document.createElement('button');
        btn.className = "w-14 h-14 bg-slate-900 border border-slate-700 rounded-xl font-bold text-lg flex items-center justify-center hover:bg-slate-700/50";
        btn.innerText = val || '';
        btn.onclick = () => handleTTTClick(idx);
        board.appendChild(btn);
      });
    }

    function handleTTTClick(idx) {
      if(tttState[idx] || checkWinner()) return;
      tttState[idx] = tttPlayer;
      tttPlayer = tttPlayer === 'X' ? 'O' : 'X';
      document.getElementById('tttStatus').innerText = `Navbat: ${tttPlayer}`;
      initTTT();
      const winner = checkWinner();
      if(winner) {
        document.getElementById('tttStatus').innerText = winner === 'T' ? "Durang!" : `G'olib: ${winner} 🎉`;
      }
    }

    function checkWinner() {
      const lines = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      for(let [a,b,c] of lines) {
        if(tttState[a] && tttState[a] === tttState[b] && tttState[a] === tttState[c]) return tttState[a];
      }
      return tttState.includes(null) ? null : 'T';
    }

    function resetTicTacToe() {
      tttState = Array(9).fill(null);
      tttPlayer = 'X';
      document.getElementById('tttStatus').innerText = `Navbat: X`;
      initTTT();
    }

    // Init App
    renderIdeas();
    renderLinks();
    renderDB();
    updateCounts();
    applyTheme();
    initTTT();
  </script>
</body>
</html>
